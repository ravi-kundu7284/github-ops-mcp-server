name: Backend CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Validate MCP Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Code formatting and lint check (Ruff)
        run: |
          ruff check app tests

      - name: Run unit and API tests (Pytest)
        run: |
          pytest -v --maxfail=1

      - name: Validate MCP Tools Registration
        run: |
          python -c "import asyncio; from app.mcp.server import mcp_server; tools = asyncio.run(mcp_server.list_tools()); assert len(tools) == 22, f'Expected 22 tools, got {len(tools)}'; print('Verified 22 MCP tools registered successfully')"

  docker-build:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: github-ops-mcp-server:latest
